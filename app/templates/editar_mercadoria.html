<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Mercadoria - Bar do Coelho</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            margin: 6px 0 0;
            color: #ddd;
        }

        .container {
            max-width: 700px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .voltar {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #222;
            font-weight: bold;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .campo input,
        .campo select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .botao {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #198754;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🍻 Bar do Coelho</h1>
    <p>Editar Mercadoria</p>
</header>

<div class="container">

    <a href="{{ url_for('mercadorias') }}" class="voltar">
        ← Voltar para o estoque
    </a>

    <div class="card">

        <h2>✏️ Editar Mercadoria</h2>

        <form method="POST">

            <div class="form-grid">

                <div class="campo">
                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        value="{{ produto.nome }}"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>

                    <select
                        id="categoria"
                        name="categoria"
                        required
                    >
                        <option value="Cervejas"
                            {% if produto.categoria == "Cervejas" %}selected{% endif %}>
                            🍺 Cervejas
                        </option>

                        <option value="Refrigerantes"
                            {% if produto.categoria == "Refrigerantes" %}selected{% endif %}>
                            🥤 Refrigerantes
                        </option>

                        <option value="Águas"
                            {% if produto.categoria == "Águas" %}selected{% endif %}>
                            💧 Águas
                        </option>

                        <option value="Bebidas"
                            {% if produto.categoria == "Bebidas" %}selected{% endif %}>
                            🧃 Bebidas
                        </option>

                        <option value="Hambúrgueres"
                            {% if produto.categoria == "Hambúrgueres" %}selected{% endif %}>
                            🍔 Hambúrgueres
                        </option>

                        <option value="Beirutes"
                            {% if produto.categoria == "Beirutes" %}selected{% endif %}>
                            🥙 Beirutes
                        </option>

                        <option value="Lanches"
                            {% if produto.categoria == "Lanches" %}selected{% endif %}>
                            🥪 Lanches
                        </option>

                        <option value="Porções"
                            {% if produto.categoria == "Porções" %}selected{% endif %}>
                            🍟 Porções
                        </option>

                        <option value="Outros"
                            {% if produto.categoria == "Outros" %}selected{% endif %}>
                            📦 Outros
                        </option>
                    </select>
                </div>

                <div class="campo">
                    <label for="preco_custo">Preço de custo</label>

                    <input
                        type="number"
                        id="preco_custo"
                        name="preco_custo"
                        step="0.01"
                        min="0"
                        value="{{ produto.preco_custo }}"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="preco_venda">Preço de venda</label>

                    <input
                        type="number"
                        id="preco_venda"
                        name="preco_venda"
                        step="0.01"
                        min="0"
                        value="{{ produto.preco_venda }}"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>

                    <input
                        type="number"
                        id="quantidade"
                        name="quantidade"
                        min="0"
                        value="{{ produto.quantidade }}"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="estoque_minimo">Estoque mínimo</label>

                    <input
                        type="number"
                        id="estoque_minimo"
                        name="estoque_minimo"
                        min="0"
                        value="{{ produto.estoque_minimo }}"
                        required
                    >
                </div>

            </div>

            <button type="submit" class="botao">
                💾 SALVAR ALTERAÇÕES
            </button>

        </form>

    </div>

</div>

</body>
</html>
