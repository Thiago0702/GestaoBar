<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Bar do Coelho</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #171717;
            padding: 20px;
            overflow: hidden;
}


        .login-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
            font-size: 14px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .campo input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .campo input:focus {
            border-color: #222;
        }

        .senha-container {
            position: relative;
        }

        .senha-container input {
            padding-right: 48px;
        }

        .mostrar-senha {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 20px;
        }

        .botao {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .botao:hover {
            opacity: 0.9;
        }

        .erro {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #ffe5e5;
            color: #b00020;
            text-align: center;
            font-size: 14px;
        }

        .recuperacao {
            margin-top: 20px;
            text-align: center;
        }

        .recuperacao a {
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .recuperacao a:hover {
            text-decoration: underline;
        }

        .logo-login {
    text-align: center;
    margin-bottom: 20px;
}


.logo-login {
    text-align: center;
    margin-bottom: 20px;
}

.logo-login img {
    width: 180px;
    max-width: 70%;
    border-radius: 50%;
}

body::before {
    content: "";
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 100vh;
    transform: translate(-50%, -50%);
    background-image: url("{{ url_for('static', filename='img/logo_coelho_bar.jpg') }}");
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    opacity: 0.10;
    z-index: 0;
    pointer-events: none;
}

.login-container {
    position: relative;
    z-index: 1;
}
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo-login">
            <img src="{{ url_for('static', filename='img/logo_coelho_bar.jpg') }}" alt="Coelho Bar e Hamburgueria">
        </div>

        <div class="logo">
            <h1>Coelho Bar e Hamburgueria</h1>
            <p>Gestão de Vendas e Estoque</p>
        </div>

        {% if erro %}
            <div class="erro">
                {{ erro }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="campo">
                <label for="usuario">Usuário</label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Digite seu usuário"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="campo">

                <label for="senha">Senha</label>

                <div class="senha-container">

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="mostrar-senha"
                        onclick="mostrarSenha()"
                        aria-label="Mostrar senha"
                    >
                        👁
                    </button>

                </div>

            </div>

            <button type="submit" class="botao">
                ENTRAR
            </button>

        </form>

        <div class="recuperacao">

    <p style="margin-bottom: 10px;">
        Primeiro acesso?
    </p>

    <a href="{{ url_for('cadastro') }}">
        CADASTRE-SE
    </a>

    <br><br>

    <a href="#">
        Esqueci meu usuário ou senha
    </a>

</div>

    </div>

    <script>

        function mostrarSenha() {

            const campo = document.getElementById("senha");

            if (campo.type === "password") {
                campo.type = "text";
            } else {
                campo.type = "password";
            }
        }

    </script>

</body>

</html>
