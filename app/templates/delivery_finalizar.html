    <script>

const fretesPorBairro = {
    "Giovane": 9,
    "Pq Recreio": 8,
    "Colônia": 13,
    "Chác. Eldorado": 6,
    "Sta. Fé": 7,
    "Casa Coelho": 6,
    "São Francisco": 8,
    "Novo Parreleiros": 6,
    "Parque Amazonas": 6,

    "Progresso": 8,
    "Barragem": 25,
    "Jusa": 13,
    "Bosque Sol": 7,
    "Fred": 18
};

function moeda(valor) {
    return Number(valor).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

function carregarResumo() {
    let carrinho = [];

    try {
        carrinho = JSON.parse(
            localStorage.getItem("delivery_carrinho") || "[]"
        );
    } catch (erro) {
        carrinho = [];
    }

    const botao = document.querySelector(
        '#form-finalizar button[type="submit"]'
    );

    const resumo = document.getElementById("resumo-itens");
    const subtotalElemento = document.getElementById("subtotal-produtos");
    const freteElemento = document.getElementById("valor-frete");
    const totalElemento = document.getElementById("total-pedido");

    if (!Array.isArray(carrinho) || carrinho.length === 0) {
        resumo.textContent = "Seu carrinho está vazio.";
        subtotalElemento.textContent = moeda(0);
        freteElemento.textContent = "—";
        totalElemento.textContent = moeda(0);
        botao.disabled = true;
        return;
    }

    let subtotal = 0;
    let quantidadeTotal = 0;

    carrinho.forEach(function(item) {
        const quantidade = Math.max(0, Number(item.quantidade) || 0);
        const preco = Math.max(0, Number(item.preco) || 0);

        subtotal += quantidade * preco;
        quantidadeTotal += quantidade;
    });

    subtotal = Math.round((subtotal + Number.EPSILON) * 100) / 100;

    resumo.textContent = quantidadeTotal + " item(ns)";
    subtotalElemento.textContent = moeda(subtotal);

    const bairro = document.getElementById("cliente_bairro").value;
    const frete = fretesPorBairro[bairro];

    if (bairro && frete !== undefined) {
        freteElemento.textContent = moeda(frete);
        totalElemento.textContent = moeda(subtotal + frete);
        botao.disabled = false;
    } else {
        freteElemento.textContent = "Selecione o bairro";
        totalElemento.textContent = "Aguardando bairro";
        botao.disabled = true;
    }
}

document.getElementById("cliente_bairro").addEventListener(
    "change",
    carregarResumo
);
        

        
document.getElementById("form-finalizar").addEventListener(
    "submit",
    async function (evento) {
        evento.preventDefault();

        const formulario = this;
        const botao = formulario.querySelector(
            'button[type="submit"]'
        );

        let carrinho = [];

        try {
            carrinho = JSON.parse(
                localStorage.getItem("delivery_carrinho") || "[]"
            );
        } catch (erro) {
            alert("Não foi possível ler o carrinho. Volte e confira os itens.");
            return;
        }

        if (!Array.isArray(carrinho) || carrinho.length === 0) {
            alert("Adicione produtos antes de continuar.");
            return;
        }

        const dadosFormulario = Object.fromEntries(
            new FormData(formulario).entries()
        );

        const pedido = {
            ...dadosFormulario,
            itens: carrinho.map(function (item) {
                return {
                    id: item.id,
                    quantidade: item.quantidade
                };
            })
        };

        botao.disabled = true;
        botao.textContent = "Enviando pedido...";

        try {
            const resposta = await fetch(
                "{{ url_for('delivery_finalizar') }}",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(pedido)
                }
            );

            const resultado = await resposta.json();

            if (!resposta.ok || !resultado.sucesso) {
                alert(
                    resultado.mensagem ||
                    "Não foi possível registrar o pedido."
                );
                return;
            }

            localStorage.removeItem("delivery_carrinho");
            sessionStorage.removeItem("delivery_dados_cliente");

            alert(
                resultado.mensagem +
                "\nTotal: " +
                Number(resultado.total).toLocaleString("pt-BR", {
                    style: "currency",
                    currency: "BRL"
                })
            );

            window.location.href =
                "{{ url_for('delivery_cardapio') }}";

        } catch (erro) {
            alert(
                "Não foi possível confirmar a comunicação com o sistema. " +
                "Confira os pedidos antes de tentar novamente."
            );
        } finally {
            botao.disabled = false;
            botao.textContent = "Confirmar dados e continuar";
        }
    }
);
        carregarResumo();
    </script>
